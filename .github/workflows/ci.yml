name: CI

on:
  push:
    # A pull request checks its branch, and the Release workflow calls this one for a pushed tag.
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: bun
          # This job packs the artifact that a release publishes, so it restores nothing from a cache.
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run knip
      - run: bun test
      - name: Pack and lint npm artifact
        run: bun run check:package
      # The upload precedes the smoke tests, which execute newly resolved consumer dependencies; the later steps still gate publication.
      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Smoke-test installed npm artifact
        run: |
          tarball=$(realpath artifact/*.tgz)
          version=$(bun -p 'require("./package.json").version')
          repo=$PWD
          consumer=$(mktemp -d)
          cd "$consumer"
          echo '{"private":true,"type":"module"}' > package.json
          cp "$repo/bunfig.toml" .
          bun add "$tarball"
          test "$(./node_modules/.bin/withings --version)" = "$version"
          cat > consumer.ts <<'EOF'
          import { buildAuthorizationUrl, createWithingsClient, type TokenStore } from "withings-cli";

          const url = buildAuthorizationUrl({
            clientId: "client",
            state: "state",
            redirectUri: "http://localhost:8765/auth/withings/callback",
          });
          if (new URL(url).searchParams.get("client_id") !== "client") {
            throw new Error("Invalid authorization URL");
          }

          // An empty store fails before any request leaves the process.
          const store: TokenStore = { load: async () => undefined, save: async () => {} };
          const failure: unknown = await createWithingsClient({ store })
            .fetchLatestMeasure()
            .catch((error: unknown) => error);
          if (!(failure instanceof Error) || !failure.message.includes("withings login")) {
            throw new Error("Invalid client export");
          }
          EOF
          bun ./consumer.ts
          "$repo/node_modules/.bin/tsc" --noEmit --strict --module nodenext consumer.ts
      - name: Smoke-test standalone executable
        run: |
          bun run build:cli
          test "$(./withings --version)" = "$(bun -p 'require("./package.json").version')"
      - run: bun audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: gitleaks
      - run: gitleaks git --no-banner --redact

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: zizmor
        run: pipx run zizmor==1.30.1 --format plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
